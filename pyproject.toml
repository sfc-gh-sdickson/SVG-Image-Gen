[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SVG-Image-Gen"
version = "0.1.0"
description = "A Streamlit app to generate SVG images using Snowflake Cortex."
readme = "README.md"
license = {text = "MIT"}
authors = [{ name = "Your Name", email = "you@example.com" }]
maintainers = [
    {name = "SVG Image Generator Team", email = "team@svg-generator.com"}
]
keywords = ["svg", "ai", "snowflake", "cortex", "streamlit", "image-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.10, <3.12"
dependencies = [
    "snowflake-snowpark-python[pandas]>=1.12.0",
    "streamlit>=1.30",
    "python-dotenv>=1.0.0",
    "toml>=0.10.2",
    "pyarrow<19.0.0",
    "cryptography>=41.0.0",
    "snowflake-connector-python>=3.15.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
    "responses>=0.23.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.2.0",
]
monitoring = [
    "structlog>=23.0.0",
    "prometheus-client>=0.17.0",
    "sentry-sdk>=1.28.0",
]
security = [
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "responses>=0.23.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.2.0",
    "coverage[toml]>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/svg-image-generator"
Documentation = "https://svg-image-generator.readthedocs.io"
Repository = "https://github.com/your-org/svg-image-generator.git"
"Bug Tracker" = "https://github.com/your-org/svg-image-generator/issues"
Changelog = "https://github.com/your-org/svg-image-generator/blob/main/CHANGELOG.md"

[project.scripts]
svg-generator = "svg_image_generator.cli:main"

[project.gui-scripts]
svg-generator-gui = "svg_image_generator.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/svg_image_generator"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/ontologies",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["svg_image_generator"]
known_third_party = ["streamlit", "snowflake", "pytest"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "snowflake.*",
    "prometheus_client.*",
    "structlog.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/svg_image_generator",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=75",
]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "snowflake: marks tests that require Snowflake connection",
    "ai: marks tests that require AI service",
    "pdca_plan: marks tests for PDCA Plan phase - analyze test failures to understand what's broken",
    "pdca_do: marks tests for PDCA Do phase - read relevant files to understand current state",
    "pdca_check: marks tests for PDCA Check phase - validate what's actually wrong vs what tests expect",
    "pdca_act: marks tests for PDCA Act phase - implement specific fixes after analysis",
    "tdd: marks tests following Test-Driven Development approach - tests must exist and fail before implementation",
    "logging: marks tests that verify logging behavior and error visibility",
    "model_driven: marks tests that validate model-driven development patterns",
]

[tool.coverage.run]
source = ["src/svg_image_generator"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
    "*/app.py",  # Exclude main Streamlit UI code
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101", "B601"]

[tool.ruff]
target-version = "py38"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.structlog]
processors = [
    "structlog.stdlib.filter_by_level",
    "structlog.stdlib.add_logger_name",
    "structlog.stdlib.add_log_level",
    "structlog.stdlib.PositionalArgumentsFormatter",
    "structlog.processors.TimeStamper",
    "structlog.processors.StackInfoRenderer",
    "structlog.processors.format_exc_info",
    "structlog.processors.UnicodeDecoder",
    "structlog.processors.JSONRenderer",
]

[tool.semantic_release]
version_toml = "pyproject.toml:project.version"
version_variable = "src/svg_image_generator/__init__.py:__version__"
dist_path = "dist/"
upload_to_pypi = true
upload_to_release = true
build_command = "pip install build && python -m build"
changelog_file = "CHANGELOG.md"

[tool.semantic_release.changelog]
exclude_commit_types = ["ci", "chore", "docs", "style", "refactor", "perf", "test"]

[tool.semantic_release.changelog.environment]
variable = "GITHUB_TOKEN"
github_token = "GITHUB_TOKEN"

[tool.poetry]
name = "svg-image-generator"
version = "1.0.0"
description = "SVG Image Generation with Snowflake Cortex AI"
authors = ["SVG Image Generator Team <team@svg-generator.com>"]
readme = "README.md"
packages = [{include = "svg_image_generator", from = "src"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[tool.poetry.dependencies]
python = "^3.8"
streamlit = "^1.28.0"
snowflake-snowpark-python = "^1.8.0"
snowflake-connector-python = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-mock = "^3.10.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"
pre-commit = "^3.0.0"
bandit = "^1.7.0"

[tool.poetry.group.monitoring.dependencies]
structlog = "^23.0.0"
prometheus-client = "^0.17.0"
sentry-sdk = "^1.28.0"

[tool.poetry.group.security.dependencies]
cryptography = "^41.0.0"
python-dotenv = "^1.0.0"
bcrypt = "^4.0.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.0"
mkdocs-material = "^9.0.0"
mkdocstrings = {extras = ["python"], version = "^0.20.0"}

[tool.poetry.scripts]
svg-generator = "svg_image_generator.cli:main"

[dependency-groups]
dev = [
    "snowflake-cli",
]

# PDCA Development Methodology Configuration
[tool.pdca]
# Development workflow configuration for Plan-Do-Check-Act cycle
methodology = "test-driven-model-driven"
description = """
PDCA (Plan-Do-Check-Act) Development Methodology with Test-Driven, Model-Driven Approach

Core Principles:
1. Tests and logs must exist and fail before implementing any function
2. Always fix tests first and add logging to make test failures evident
3. Follow the PDCA cycle for all development work

Workflow:
- PLAN: Analyze test failures to understand what's broken
- DO: Read relevant files to understand current state
- CHECK: Validate what's actually wrong vs what tests expect
- ACT: Only then propose specific fixes

Required Tools:
- pytest with PDCA markers for workflow tracking
- structlog for comprehensive logging
- coverage reporting for validation
- mypy for type checking and model validation
- make for build and development workflow orchestration
- uv for dependency and task management
"""

# Tool Transformation Model Configuration
[tool.transformations]
# Defines tools as transformation agents for different artifact types
description = """
Tool Transformation Model: All development tools are modeled as transformation agents
that convert input artifacts to output artifacts. This includes build tools, testing tools,
documentation generators, and development workflow orchestration.

Transformation Categories:
- Build Tools: pyproject.toml, Makefile, uv
- Testing Tools: pytest, coverage, mypy
- Documentation: mkdocs, markdown processors
- Code Quality: black, ruff, flake8, bandit
- Development: streamlit, snowflake tools
- Artifact Processing: MDC, TTL, PDF, requirements files
"""

[tool.transformations.build_tools]
make = {command = "make", description = "Build and development workflow orchestration"}
uv = {command = "uv", description = "Python package and dependency management"}
hatchling = {command = "hatchling", description = "Python package building"}
pip = {command = "pip", description = "Python package installation"}

[tool.transformations.testing_tools]
pytest = {command = "pytest", description = "Test execution and PDCA phase tracking"}
coverage = {command = "coverage", description = "Test coverage measurement"}
mypy = {command = "mypy", description = "Type checking and model validation"}

[tool.transformations.code_quality]
black = {command = "black", description = "Code formatting"}
ruff = {command = "ruff", description = "Fast Python linter"}
flake8 = {command = "flake8", description = "Style guide enforcement"}
bandit = {command = "bandit", description = "Security linting"}
isort = {command = "isort", description = "Import sorting"}

[tool.transformations.documentation]
mkdocs = {command = "mkdocs", description = "Documentation site generation"}
markdown_processors = ["markdown-it-py", "mistune", "panflute"]

[tool.transformations.artifact_processors]
mdc = {libraries = ["PyYAML", "ruamel.yaml"], description = "Model Definition Card processing"}
ttl = {libraries = ["rdflib"], description = "Turtle/RDF processing"}
pdf = {libraries = ["reportlab", "weasyprint"], description = "PDF generation"}
requirements = {libraries = ["pip-tools"], description = "Requirements file management"}

[tool.transformations.development]
streamlit = {command = "streamlit", description = "Web application framework"}
snowflake = {command = "snowsql", description = "Snowflake database interaction"}

# Makefile Integration Configuration
[tool.make]
# Integration with Makefile for build and development workflows
description = """
Makefile integration for development workflow orchestration.
All development tasks are mapped to make targets for consistency.
"""

[tool.make.targets]
install = {command = "make install", description = "Install runtime dependencies"}
install_dev = {command = "make install-dev", description = "Install development dependencies"}
test = {command = "make test", description = "Run all tests"}
test_cov = {command = "make test-cov", description = "Run tests with coverage"}
test_fast = {command = "make test-fast", description = "Run fast tests only"}
test_integration = {command = "make test-integration", description = "Run integration tests"}
test_unit = {command = "make test-unit", description = "Run unit tests"}
lint = {command = "make lint", description = "Run all linting checks"}
format = {command = "make format", description = "Format code"}
clean = {command = "make clean", description = "Clean build artifacts"}
build = {command = "make build", description = "Build package"}
run = {command = "make run", description = "Run Streamlit app"}
run_dev = {command = "make run-dev", description = "Run Streamlit app in development mode"}
docs = {command = "make docs", description = "Build documentation"}
docs_serve = {command = "make docs-serve", description = "Serve documentation locally"}
check = {command = "make check", description = "Run lint and test"}
pre_commit = {command = "make pre-commit", description = "Run pre-commit hooks"}
setup_dev = {command = "make setup-dev", description = "Setup development environment"}

[tool.make.pdca_integration]
# PDCA workflow mapped to make targets
plan = {targets = ["test", "lint"], description = "Run tests and checks to identify issues"}
do = {targets = ["docs"], description = "Generate documentation for current state"}
check = {targets = ["test-cov", "lint"], description = "Validate with coverage and quality checks"}
act = {targets = ["format", "build", "test"], description = "Format, build, and test changes"}

# UV Integration Configuration
[tool.uv]
# UV tool integration for modern Python development
description = """
UV integration for fast Python package management and task execution.
Preferred over pip for dependency management and build tasks.
"""

[tool.uv.commands]
install = {command = "uv pip install", description = "Install packages"}
install_dev = {command = "uv pip install -r requirements-dev.txt", description = "Install dev dependencies"}
build = {command = "uv build", description = "Build package"}
publish = {command = "uv publish", description = "Publish package"}
run = {command = "uv run", description = "Run Python scripts"}
sync = {command = "uv sync", description = "Sync dependencies"}
update = {command = "uv pip install --upgrade", description = "Update packages"}

[tool.pdca.workflow]
plan_phase = [
    "run existing tests to identify failures",
    "analyze test output and error messages",
    "understand the expected vs actual behavior",
    "identify root cause of failures"
]
do_phase = [
    "read relevant source files",
    "examine current implementation state",
    "review related test files",
    "understand dependencies and context"
]
check_phase = [
    "validate actual behavior against test expectations",
    "verify logging output for error visibility",
    "check type annotations and model compliance",
    "confirm test coverage requirements"
]
act_phase = [
    "implement specific fixes based on analysis",
    "add comprehensive logging for debugging",
    "update tests if necessary",
    "validate changes against all test suites"
]

[tool.pdca.requirements]
test_first = true
logging_required = true
coverage_minimum = 75
type_checking = true
model_validation = true
scope_discipline = true
tool_compliance = true
change_minimization = true

[tool.pdca.enforcement]
scope_control = "strict"
change_minimization = "mandatory"
tool_compliance = "strict"
pdca_phase_completion = "required"
unauthorized_changes = "prohibited"
make_command_usage = "mandatory"
